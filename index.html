<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>슝</title>
  <meta name="theme-color" content="#F2F4F6">
  <meta name="description" content="슝 · 짜고, 같이 가고, 슝. 일정·동선·가계부·정산을 친구와 함께.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="슝">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    #splash{position:fixed;inset:0;z-index:100;background:#2E5BFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;transition:opacity .35s ease,visibility .35s}
    #splash.out{opacity:0;visibility:hidden}
    #splash svg{width:160px;height:68px;overflow:visible}
    #splash .route{stroke-dasharray:.1 9;stroke-dashoffset:0}
    #splash .plane{animation:shoong 1s cubic-bezier(.3,.7,.2,1) both}
    #splash .dot{animation:pop .4s ease-out both}
    #splash .route{animation:draw 1s ease-out both}
    #splash b{font-size:56px;font-weight:700;letter-spacing:-.06em;line-height:1;animation:rise .5s .35s ease-out both}
    #splash span{font-size:13px;color:#D6E0FF;letter-spacing:-.01em;animation:rise .5s .5s ease-out both}
    @keyframes shoong{from{transform:translate(-110px,40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
    @keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 160 68"><path class="route" d="M10 58 C44 54 92 36 134 14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><circle class="dot" cx="10" cy="58" r="7" fill="#FFD66B" style="transform-origin:10px 58px"/><g class="plane"><path transform="translate(127 1) rotate(62 12 12)" fill="#fff" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></g></svg>
    <b>슝</b>
    <span>짜고, 같이 가고, 슝</span>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
