    #splash .p{animation:shoong .9s 1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes shoong{from{transform:translateX(-220px);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
    @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  <script>
    // 안전장치: 앱 코드가 못 뜨면 로고에서 멈추지 않고 이유 + 새로고침 버튼
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) { errs.push((e.message || 'error') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { errs.push('promise: ' + ((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () {
        if (window.__booted) return;
        var sp = document.getElementById('splash'); if (!sp) return;
        var box = document.createElement('div');
        box.style.cssText = 'margin-top:28px;text-align:center;font-size:14px;line-height:1.5;max-width:300px;padding:0 20px';
        box.innerHTML = '앱을 불러오지 못했어요<br><small style="opacity:.75;word-break:break-all">' + (errs[0] || '응답 없음').replace(/[<>&]/g, '') + '</small><br><button id="hardReload" style="margin-top:14px;border:0;border-radius:99px;padding:10px 18px;font:inherit;font-weight:600;color:#2E5BFF;background:#fff">새로 받기</button>';
        sp.appendChild(box);
        document.getElementById('hardReload').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        };
      }, 8000);
    })();
  </script>
